<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Encargado</title>
<link rel="stylesheet" href="Encargado.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar-header">
    <h2>Panel Administrativo</h2>
    <p>Hotel La Fortuna</p>
    </div>
    <nav>
    <ul class="sidebar-nav">
        <li><a href="#habitaciones" class="sidebar-item active"><i class="fas fa-bed"></i> Habitaciones</a></li>
        <li><a href="#reclamos" class="sidebar-item"><i class="fas fa-exclamation-triangle"></i> Reclamos</a></li>
    </ul>
    <a href="#" id="logout-link" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </nav>
</aside>

<div class="main-content">
    <div class="header-encargado" id="user-info-panel">
    <h1>Bienvenido, <span id="user-display-name">Encargado</span></h1>
    <p id="user-id-display" style="font-size: 0.9rem; margin-top: 8px;">ID de usuario: <span id="user-id">Cargando...</span></p>
    </div>
    <main class="main-panel">
    <section id="habitaciones">
        <div class="card">
        <h2>Gestión de Habitaciones</h2>
        <form id="add-room-form">
            <label for="room-number">Número de Habitación:</label>
            <input type="number" id="room-number" class="input" placeholder="Ej. 101" required>
            <label for="room-type">Tipo de Habitación:</label>
            <input type="text" id="room-type" class="input" placeholder="Ej. Doble, Suite" required>
            <button type="submit" class="btn">Agregar Habitación</button>
        </form>
        </div>

        <div class="card" style="margin-top: 24px;">
        <h2>Lista de Habitaciones</h2>
        <div id="rooms-list">
            <p style="text-align: center;">Cargando habitaciones...</p>
        </div>
        </div>
    </section>

    <section id="reclamos" style="display: none;">
        <div class="card">
        <h2>Gestión de Reclamos</h2>
        <form id="add-claim-form">
            <label for="claim-text">Reclamo:</label>
            <input type="text" id="claim-text" class="input" placeholder="Descripción del reclamo" required>
            <label for="claim-room">Habitación:</label>
            <input type="number" id="claim-room" class="input" placeholder="Número de habitación" required>
            <button type="submit" class="btn">Agregar Reclamo</button>
        </form>
        </div>

        <div class="card" style="margin-top: 24px;">
        <h2>Reclamos Pendientes</h2>
        <ul class="reclamos-list" id="claims-list">
            <p style="text-align: center;">Cargando reclamos...</p>
        </ul>
        </div>
    </section>
    </main>
</div>

<div id="confirm-modal-overlay" class="modal-overlay">
    <div class="modal">
    <h2 id="modal-title"></h2>
    <p id="modal-message"></p>
    <div class="modal-actions">
        <button class="btn-secondary" id="cancel-btn">Cancelar</button>
        <button class="btn-danger" id="confirm-btn">Confirmar</button>
    </div>
    </div>
</div>

<script src="Encargado.js"></script>
</body>
</html>
