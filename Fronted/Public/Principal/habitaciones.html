<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitaciones - Casa del Inka</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }
        
        .form-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            width: 100%;
            margin-bottom: 16px;
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .form-input:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.8);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            margin: 5% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        
        .close-modal {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
        }
        
        .room-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .room-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .room-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-available {
            background: #d4edda;
            color: #155724;
        }
        
        .status-occupied {
            background: #f8d7da;
            color: #721c24;
        }
        
        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .preview-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .search-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .filter-group label {
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        
        .filter-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            min-width: 150px;
        }
        
        .filter-select option {
            background: #333;
            color: white;
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-6">
        <!-- Header -->
        <div class="glass-card p-6 mb-8">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <button onclick="window.history.back()" class="btn-secondary btn-primary">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <h1 class="text-3xl font-bold text-white">
                        <i class="fas fa-bed mr-3"></i>
                        Gestión de Habitaciones
                    </h1>
                </div>
                <button onclick="openCreateModal()" class="btn-primary">
                    <i class="fas fa-plus"></i>
                    Crear Habitación
                </button>
            </div>
        </div>
        
        <!-- Search and Filters -->
        <div class="glass-card p-6 mb-8">
            <div class="search-filters">
                <div class="filter-group">
                    <label for="searchInput">Buscar:</label>
                    <input type="text" id="searchInput" class="form-input" placeholder="Buscar por nombre, tipo, piso...">
                </div>
                <div class="filter-group">
                    <label for="statusFilter">Estado:</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="">Todos</option>
                        <option value="disponible">Disponible</option>
                        <option value="ocupada">Ocupada</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="typeFilter">Tipo:</label>
                    <select id="typeFilter" class="filter-select">
                        <option value="">Todos</option>
                        <option value="estandar">Estándar</option>
                        <option value="matrimonial">Matrimonial</option>
                        <option value="deluxe">Deluxe</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="floorFilter">Piso:</label>
                    <select id="floorFilter" class="filter-select">
                        <option value="">Todos</option>
                        <option value="1">Piso 1</option>
                        <option value="2">Piso 2</option>
                        <option value="3">Piso 3</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Rooms List -->
        <div id="roomsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Rooms will be loaded here -->
        </div>
        
        <!-- Create/Edit Modal -->
        <div id="roomModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeModal()">&times;</span>
                <h2 id="modalTitle">Crear Habitación</h2>
                <form id="roomForm">
                    <input type="hidden" id="roomId">
                    
                    <label for="roomName">Nombre:</label>
                    <input type="text" id="roomName" class="form-input" required>
                    
                    <label for="roomType">Tipo:</label>
                    <select id="roomType" class="form-input" required>
                        <option value="estandar">Estándar</option>
                        <option value="matrimonial">Matrimonial</option>
                        <option value="deluxe">Deluxe</option>
                    </select>
                    
                    <label for="roomFloor">Piso:</label>
                    <input type="number" id="roomFloor" class="form-input" required min="1">
                    
                    <label for="roomCapacity">Capacidad:</label>
                    <input type="number" id="roomCapacity" class="form-input" required min="1">
                    
                    <label for="roomPrice">Precio por día:</label>
                    <input type="number" id="roomPrice" class="form-input" required min="0" step="0.01">
                    
                    <label for="roomDescription">Descripción:</label>
                    <textarea id="roomDescription" class="form-input" rows="3"></textarea>
                    
                    <label for="roomImages">Imágenes:</label>
                    <input type="file" id="roomImages" class="form-input" multiple accept="image/*">
                    <div id="imagePreview" class="image-preview"></div>
                    
                    <div class="flex gap-4 mt-6">
                        <button type="submit" class="btn-primary flex-1">
                            <i class="fas fa-save"></i>
                            Guardar
                        </button>
                        <button type="button" onclick="closeModal()" class="btn-secondary flex-1">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeDeleteModal()">&times;</span>
                <h2>Confirmar Eliminación</h2>
                <p>¿Estás seguro de que deseas eliminar esta habitación? Esta acción no se puede deshacer.</p>
                <div class="flex gap-4 mt-6">
                    <button onclick="confirmDelete()" class="btn-danger btn-primary flex-1">
                        <i class="fas fa-trash"></i>
                        Eliminar
                    </button>
                    <button onclick="closeDeleteModal()" class="btn-secondary flex-1">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="habitaciones.js"></script>
</body>
</html>
